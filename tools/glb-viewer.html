<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Visualizador GLB · Quebrada Royale</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #20242e; font: 13px 'Segoe UI', sans-serif; color: #fff; }
      canvas { width: 100%; height: 100%; display: block; outline: none; }
      #info { position: fixed; left: 10px; top: 10px; padding: 8px 10px; background: rgba(0, 0, 0, 0.6); border-radius: 8px; white-space: pre; max-width: 46vw; }
      #anims { position: fixed; right: 10px; top: 10px; display: flex; flex-direction: column; gap: 4px; }
      #anims button { padding: 5px 10px; border: 0; border-radius: 6px; background: #ffd21f; font-weight: 800; cursor: pointer; }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="info">Carregando…</div>
    <div id="anims"></div>
    <!-- Uso: /tools/glb-viewer.html?file=/caminho/modelo.glb -->
    <script type="module" src="./glb-viewer.ts"></script>
  </body>
</html>
